<!--
  TICKET ITEM PARTIAL — HolderTicketItem.html
  Dùng để build từng ticket rồi concat vào {{TicketsHtml}} trong template chính.
  Placeholder: {{TicketTypeName}}, {{HolderName}}, {{TicketCode}}, {{QrCodeUrl}}, {{Price}}
-->
<table class="ticket-card" role="presentation" cellpadding="0" cellspacing="0" width="100%" style="border:1px solid #E2E8F0;border-radius:6px;margin-bottom:12px;overflow:hidden;">
    <tr>
        <!-- LEFT: ticket info -->
        <td style="padding:20px 24px;vertical-align:top;">

            <!-- holder badge -->
            <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:14px;">
                <tr>
                    <td style="background-color:#EFF6FF;border:1px solid #BFDBFE;border-radius:3px;padding:3px 8px;">
            <span style="font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:12px;color:#1D4ED8;">
              &#128100; Holder: {{HolderName}}
            </span>
                    </td>
                </tr>
            </table>

            <p style="margin:0 0 4px;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:12px;color:#64748B;letter-spacing:1px;text-transform:uppercase;">{{TicketTypeName}}</p>
            <p style="margin:0 0 12px;font-family:Georgia,'Times New Roman',serif;font-size:16px;color:#0F172A;">{{EventName}}</p>
            <span style="display:inline-block;background-color:#F1F5F9;border-radius:3px;padding:4px 10px;font-family:'Courier New',Courier,monospace;font-size:12px;color:#334155;letter-spacing:1px;">{{TicketCode}}</span>
            <p style="margin:6px 0 0;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:13px;color:#64748B;">{{Price}}</p>
        </td>

        <!-- DASHED DIVIDER (simulated with border-left dashed) -->
        <td class="ticket-qr-cell" width="110" style="border-left:1px dashed #CBD5E1;background-color:#FAFAFA;padding:16px;text-align:center;vertical-align:middle;">
            <img src="{{QrCodeUrl}}" alt="QR Code for {{TicketCode}}" width="70" height="70" style="display:block;margin:0 auto 6px;border-radius:4px;">
            <p style="margin:0;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:10px;color:#94A3B8;letter-spacing:0.5px;">Scan at door</p>
        </td>
    </tr>
</table>
